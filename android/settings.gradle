pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // 插件版本集中管理
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'com.android') {
                useVersion("7.4.2") // 统一Android Gradle插件版本
            }
            if (requested.id.id == 'org.jetbrains.kotlin.android') {
                useVersion("1.8.22") // 统一Kotlin插件版本
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "2.3.0" // 更新Flutter插件加载器
    id "com.android.application" version "7.4.2" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false // Firebase服务
}

include ":app"